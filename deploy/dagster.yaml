# Dagster configuration with environment variable placeholders
# Copied into container images at build time

# PostgreSQL storage backend (connection string for Unix socket support)
storage:
  postgres:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

# Cloud Run run launcher
run_launcher:
  module: dagster_contrib_gcp.cloud_run.run_launcher
  class: CloudRunRunLauncher
  config:
    project:
      env: GCP_PROJECT_ID
    region:
      env: GCP_REGION
    job_name_by_code_location:
      # Key must match the code location's RUNTIME name. The webserver and
      # daemon load code IN-PROCESS via pyproject.toml [tool.dagster] (the
      # baked workspace.yaml is NOT loaded — dagster only discovers it from
      # the working directory, and the image keeps it in dagster_home/), so
      # the location is named after the module. If workspace-based loading is
      # ever wired up for real (issue #78), this key becomes that file's
      # location_name.
      dagster_pipeline.definitions: dagster-run-worker-gtfsrt
    run_timeout: 86400

# Queued run coordinator for managing concurrent runs
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 10

# GCS compute log manager
compute_logs:
  module: dagster_gcp.gcs.compute_log_manager
  class: GCSComputeLogManager
  config:
    bucket:
      env: DAGSTER_LOGS_BUCKET
    prefix: compute_logs

# Disable telemetry
telemetry:
  enabled: false
