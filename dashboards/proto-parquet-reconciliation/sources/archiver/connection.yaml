name: archiver
type: duckdb
options:
  # Resolved relative to this sources/archiver/ directory — ../../ lands at
  # the dashboard root, where extract.py writes data/. Opened read-only by
  # Evidence, so re-running extract.py while `npm run dev` is up is safe —
  # but remember to re-run `npm run sources` to pick up new data.
  filename: ../../data/reconciliation.duckdb
